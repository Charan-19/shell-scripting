apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: app
spec:
  clusterIP: None
  selector:
    component: mysql
    project: roboshop
    tier: app
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: app
spec:
  serviceName: "mysql-headless"
  replicas: 2
  selector:
    matchLabels:
      component: mysql
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        component: mysql
        project: roboshop
        tier: app
    spec:
      serviceAccountName: roboshop-mysql-secret-reader
      volumes:
        - name: mysql-secret
          emptyDir: {}
      containers:
        - name: fetchsecrets
          image: amazon/aws-cli
          volumeMounts:
          - name: mysql-secret
            mountPath: /tmp
      initContainers:
        - name: init-myservice
          image: aws-ci
          command: ['sh', '-c', "aws secretsmanager get-secret-value --secret-id mysql_password --query secretString --output text | jq -r .MYSQL_ROOT_PASSWORD > /tmp/mysql_root_password.txt"]
          volumeMounts:
          - name: mysql-secret
            mountPath: /tmp

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: app
spec:
  selector:
    component: mysql
    project: roboshop
    tier: app
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

