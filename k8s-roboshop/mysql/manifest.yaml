apiVersion: v1
kind: Secret
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: app
data:
 MYSQL_ROOT_PASSWORD: "Um9ib1Nob3BAMTk="
---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: mysql
 namespace: roboshop
 labels:
   component: mysql
   project: roboshop
   tier: app
spec:
 replicas: 1
 selector:
   matchLabels:
     component: mysql
     project: roboshop
     tier: app
 template:
   metadata:
     labels:
       component: mysql
       project: roboshop
       tier: app
   spec:
     containers:
     - name: mysql
       image: saicharan452/mysql:v3
       envFrom:
        - secretRef:
            name: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: app
spec:
  selector:
    component: mysql
    project: roboshop
    tier: app
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

