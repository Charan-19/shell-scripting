apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
  labels:
    component: cart
    project: roboshop
    tier: app
data:
 REDIS_HOST: "redis"
 CATALOGUE_HOST: "catalogue"
 CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: cart
 namespace: roboshop
 labels:
   component: cart
   project: roboshop
   tier: app
spec:
 replicas: 1
 selector:
   matchLabels:
     component: cart
     project: roboshop
     tier: app
 template:
   metadata:
     labels:
       component: cart
       project: roboshop
       tier: app
   spec:
     containers:
     - name: cart
       image: saicharan452/cart:v3
       envFrom:
        - configMapRef:
            name: cart
       resources:
         requests:
           memory: "128Mi"
           cpu: "50m"
         limits:
           memory: "256Mi"
           cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: roboshop
  labels:
    component: cart
    project: roboshop
    tier: app
spec:
  selector:
    component: cart
    project: roboshop
    tier: app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart-hpa
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cart   # Name of the deployment to scale
  minReplicas: 2   # Minimum number of pods
  maxReplicas: 10  # Maximum number of pods
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 10  # Target average CPU utilization percentage
