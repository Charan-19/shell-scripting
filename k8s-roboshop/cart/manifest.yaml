apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
  labels:
    component: cart
    project: roboshop
    tier: app
data:
 REDIS_HOST: "redis"
 CATALOGUE_HOST: "catalogue"
 CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: cart
 namespace: roboshop
 labels:
   component: cart
   project: roboshop
   tier: app
spec:
 replicas: 1
 selector:
   matchLabels:
     component: cart
     project: roboshop
     tier: app
 template:
   metadata:
     labels:
       component: cart
       project: roboshop
       tier: app
   spec:
     containers:
     - name: cart
       image: saicharan452/cart:v3
       envFrom:
        - configMapRef:
            name: cart
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: roboshop
  labels:
    component: cart
    project: roboshop
    tier: app
spec:
  selector:
    component: cart
    project: roboshop
    tier: app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

