networks:
  default:
    driver: bridge
    external: true
    name: roboshop
services:
  mongodb:
    image: saicharan452/mongodb:1.0
    container_name: mongodb
  catalogue:
    image: saicharan452/catalogue:1.0
    container_name: catalogue
    depends_on:
      - mongodb
  redis:
    image: redis:7.0
    container_name: redis
  user:
    image: saicharan452/user:1.0
    container_name: user
    depends_on:
      - redis
      - mongodb
  cart:
    image: saicharan452/cart:1.0
    container_name: cart
    depends_on:
      - catalogue
      - redis
  mysql:
    image: saicharan452/mysql:1.0
    container_name: mysql
  shipping:
    image: saicharan452/shipping:1.0
    container_name: shipping
    depends_on:
      - mysql
      - cart
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=Roboshop@19
  payment:
    image: saicharan452/payment:1.0
    container_name: payment
    environment:
      - CART_HOST=cart
      - CART_PORT=8080
      - USER_HOST=user
      - USER_PORT=8080
      - AMQP_HOST=rabbitmq
      - AMQP_USER=user
      - AMQP_PASS=Roboshop@19
    deqpends_on:
      - cart
      - user
      - rabbitmq